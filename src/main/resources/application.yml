# ============================================================================
# 个人微信 AI 自动回复机器人配置（Java 逻辑端）
#
# 架构说明（Java 只负责“思考”，Python 负责微信收发）：
#   1. 本服务（Spring Boot）只提供 REST 接口，调用远端大模型生成回复；
#   2. Python 端脚本（python/wechat_bridge_3x.py 或 _4x.py）负责用 wxauto
#      监听微信新消息，把消息 POST 到本服务，再把 AI 回复发回微信。
#
# 风险提示：
#   1. 个人微信自动化违反微信用户协议，账号可能被限制/封禁，务必使用【测试小号】！
#   2. 聊天内容会发送到第三方大模型服务（DeepSeek/OpenAI），切勿输入隐私或机密信息。
#   3. api-key 是敏感信息：不要提交到 git，推荐用环境变量注入（见下方示例）。
#   4. 旧方案 wechat-api（网页版协议）已默认关闭：微信服务器对大多数账号返回
#      ret=1203（不能登录网页微信），网页版方案不可用，请用 wxauto 方案。
# ============================================================================
spring:
  application:
    name: wechat-ai-bot

  # 必须启用 Web 服务器（默认即 servlet），否则 /api/reply 桥接接口不生效
  main:
    web-application-type: servlet

  # 模型改为双 Bean 管理（见 config/ModelConfig.java）：
  #   - 智谱 zhipuChatModel（默认，GLM-4.7-Flash 免费，key=ZHIPU_API_KEY）
  #   - DeepSeek deepSeekChatModel（付费，deepseek-chat，key=DEEPSEEK_API_KEY）
  # 因此排除 Spring AI 的 OpenAI 自动配置，避免默认 bean 与自定义 bean 冲突。
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

  # MySQL 数据源：对话记忆 + 消息流水都存这里
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/wechat_bot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:bot}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 启动时自动执行 classpath:schema.sql 建表（CREATE TABLE IF NOT EXISTS，幂等）
  sql:
    init:
      mode: always
      encoding: UTF-8

# 服务器端口（Python 脚本默认连接 http://127.0.0.1:8080）
server:
  port: 8080

logging:
  # 同时把日志写入项目根目录下的 logs/wechat-ai-bot.txt（控制台仍会输出，重启后生效）
  file:
    name: logs/wechat-ai-bot.txt
  level:
    # 旧网页版微信协议的调试日志已不需要，保持 INFO 即可
    io.uouo.wechat: INFO

# 微信机器人参数（自定义配置，映射到 WeChatBotProperties）
wechat:
  bot:
    # 旧方案（网页版 wechat-api-uouo）是否启用：默认 false。
    # 推荐用 Python + wxauto 收发微信，Java 只做 AI 推理。
    # 若仍想尝试网页版登录，可改为 true（但多数账号会被 ret=1203 拒绝）。
    enabled: false
    # auto-login 必须保持 false（wechat-api-uouo 有重复登录 bug，会把自己踢下线）
    auto-login: false
    # 在终端打印登录二维码（仅旧网页版方案使用）
    show-terminal: true
    # 框架自带自动回复（仅旧网页版方案使用，建议 false，由 AI 逻辑处理）
    auto-reply: false
    # 对话记忆参数（映射到 MemoryProperties）
    memory:
      # 每个会话保留的最近消息条数（用户+AI 合计，约等于一半轮数）
      max-messages: 40
      # 滚动摘要：滑出窗口的旧对话由免费模型异步压缩成要点，注入 system prompt，
      # 解决"窗外失忆"。关闭后窗口外的历史不再进入上下文。
      summary-enabled: true
      # 摘要最大字符数（超出截断，控制注入的 token 量）
      summary-max-chars: 500

# ============================================================================
# Obsidian 知识库接入（关键词检索 RAG，方案 A）
# ============================================================================
obsidian:
  # Obsidian 库根目录（绝对路径）。留空 = 不启用 RAG。
  # 推荐用环境变量注入，例如：
  #   $env:OBSIDIAN_VAULT_PATH = "C:\Users\ChelseaFC\Desktop\wo\webflow"
  vault-path: ${OBSIDIAN_VAULT_PATH:C:\Users\ChelseaFC\Desktop\wo\webflow}
  # 提问时最多拼入 Prompt 的笔记块数量
  top-k: 5
  # 单个笔记块的最大字符数
  max-chunk-chars: 600
  # 安全基线：包含这些片段的文件不索引、且任何接口（含文件树）都不可见。
  # 不可通过 API 解锁——真正不想让任何形式暴露的路径放这里。
  exclude-patterns:
    - .mimocode
    - node_modules
    - .obsidian
  # 受保护目录（可解锁的隐私目录，与上面基线的区别：持管理令牌后可加入/移出索引）：
  # 默认不索引，文件树中只显示折叠节点（不露子文件名）。
  # 加入索引状态持久化在 rag_unlock_path 表，经 /api/vault/protect/add|remove 切换。
  protected-dirs:
    - 40-Life
  # Agent 写笔记输出目录（相对库根目录）：web 端聊天让 AI 保存笔记时写入这里，
  # 写入走"草稿→网页确认→落盘"两阶段流程。留空 = 禁用笔记写入。
  # 不想被检索时，把本目录加进 /api/rag/patterns 的排除规则即可。
  agent-output-dir: 90-Agent
